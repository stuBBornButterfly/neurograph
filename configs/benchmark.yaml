# Phase 9: fine-tuned vs base vs a larger reference model behind an API, plus RAGAS and the human-audit sheet.
# The reference here is a self-hosted 9B model through Ollama (no commercial API key was available for this run).
# Any OpenAI-compatible commercial API drops in by changing this block, e.g.
#   kind: openai, base_url: https://api.openai.com/v1, model: <model>, api_key_env: BENCH_API_KEY, external: true,
#   price_in_per_mtok / price_out_per_mtok: the provider's list prices in USD per million tokens
reference:
  name: Qwen3.5-9B via Ollama (self-hosted API)
  kind: ollama                 # ollama | openai
  base_url: http://localhost:11434
  model: qwen3.5:9b
  api_key_env: null            # name of the environment variable holding the key (never the key itself)
  external: false              # true = outside service: only public questions (university pages, literature) are sent
  price_in_per_mtok: 0.0       # USD; 0 = self-hosted, no API bill
  price_out_per_mtok: 0.0
models:                        # what is compared (same prompts, same retrieved passages, greedy decoding, one request at a time)
  - {name: base, label: "Qwen2.5-3B base"}
  - {name: finetuned, label: "Qwen2.5-3B + QLoRA"}
  - {name: routed, label: "QLoRA on policy, base on study/literature"}   # the adapter only where it was trained
  - {name: gguf, label: "routed, Q4_K_M GGUFs on CPU (as deployed)"}
  - {name: reference, label: "reference API model"}
heldout:
  n: 100                       # held-out QLoRA test examples (all negatives + a seeded sample of positives)
gguf_threads: 8                # CPU threads for the deployed-model row (the free Space has 2 vCPU: slower there)
judge:                         # RAGAS judge: a different model family from every contestant (less self-preference)
  kind: ollama
  base_url: http://localhost:11434/v1
  model: gemma2:9b-instruct-q4_K_M
  embeddings: BAAI/bge-small-en-v1.5
  heldout_n: 30                # RAGAS on a seeded sample of held-out positives as well as the gold questions
audit:
  n: 50
  seed: 97
  out: eval/human_audit.csv
gpu_watts: 180                 # RTX 5060 Ti board power, for the energy estimate of self-hosted rows
