embedding:
  model: BAAI/bge-small-en-v1.5      # 384-dim, small enough for CPU
  query_prefix: "Represent this sentence for searching relevant passages: "   # BGE convention for short queries
  batch_size: 32
qdrant:
  collection: policy_pages
  path: institutional/qdrant         # under derivatives_dir; embedded Qdrant, saved to disk
retrieval:
  method: dense                    # 6.2 eval: dense hit@1 0.89 vs hybrid 0.67 vs BM25 0.50 on 18 questions
  k: 5
  rrf_k: 60                          # reciprocal rank fusion constant
  eval_k: [1, 3, 5]
gold: eval/retrieval_gold.jsonl
llm:
  model: Qwen/Qwen2.5-3B-Instruct        # base model on a Kaggle T4; Phase 7 swaps in the QLoRA fine-tune
  max_new_tokens: 300
nli:
  model: cross-encoder/nli-deberta-v3-small   # checks each answer sentence against the retrieved passages
  min_entail: 0.5
agent:
  context_k: 4                           # passages given to the model
  # student words -> the words the university's pages use (search only; the question shown to the model is unchanged)
  query_expansions:
    'chat ?gpt|\bgpt\b|gemini|copilot|chatbot': artificial intelligence (AI) tools policy
    '\bcgpa\b|\bgpa\b': grade point average
    '\bdrop(?:ped)?\b': withdrawal
  gold: eval/agent_gold.jsonl
