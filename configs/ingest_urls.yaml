# Phase 6: public university pages for the student-support assistant
# status: proposed -> Ayesha approves before anything is downloaded for ingestion
# checked 2026-10-20: every URL returns 200; robots.txt returns 404 (no crawl rules), so we stay polite
status: approved                 # Ayesha, 2026-10-20 ("do what is best" after reviewing the proposed list)
crawl:
  delay_s: 2                   # one request every 2 s
  user_agent: "NeuroGraph-research/0.1 (student portfolio project; contact via GitHub stuBBornButterfly)"
  follow_links: false          # only the pages listed here, no crawling
  keep: [url, title, retrieved_at, sha256]
pii:
  redact: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER]   # staff names and personal emails/phones removed at ingestion
  keep_office_contacts: [ccc@university.example, swd@university.example, info@university.example, "09666775577"]   # role-based, needed for referrals

pages:
  academic_rules:              # grading, CGPA, probation, dismissal, retake, withdrawal, leave of absence
    - https://www.university.example/grades-rules-and-regulations
    - https://www.university.example/student-rules-regulation
    - https://www.university.example/academic-calendar
    - https://www.university.example/faq
    - https://www.university.example/students-helpdesk
  fees_and_aid:
    - https://www.university.example/undergraduate-tuition-fees
    - https://www.university.example/scholarships-financial-aid
  policies:                    # conduct and integrity
    - https://www.university.example/university-policies
    - https://www.university.example/storage/app/media/Policies/Disciplinary%20Policy.pdf
    - https://www.university.example/storage/app/media/Policies/Plagiarism%20Policy.pdf
    - https://www.university.example/storage/app/media/Policies/Artificial%20Intelligence%20Policy.pdf
    - https://www.university.example/storage/app/media/Policies/Grievance%20Policy_2.pdf
    - https://www.university.example/storage/app/media/Policies/Equity%20Diversity%20and%20Inclusion%20Policy.pdf
  support_services:            # where the safety node refers students
    - https://www.university.example/career-counseling-center                    # Dept. of Students' Welfare: "mental health and wellbeing"
    - https://www.university.example/admin-office/office-of-the-students-welfare # psychosocial counsellors, Room 301
    - https://www.university.example/admin-office/university-medical-centre
    - https://www.university.example/admin-office/office-of-the-proctor
  offices:                     # who handles what
    - https://www.university.example/admin-office/office-of-the-registrar
    - https://www.university.example/admin-office/office-of-the-controller-of-examination

skipped:                       # approved but not ingested
  - {url: "https://ccc.university.example/", reason: "JavaScript-only page; plain download is an empty shell"}
  - {url: "https://ccc.university.example/ccc-faq", reason: "JavaScript-only page"}
  - {url: "https://ccc.university.example/ccc_contact_us", reason: "JavaScript-only page"}
  - {url: "https://www.university.example/university-sexual-harassment-elimination-and-prevention-policy", reason: "no text, only links to sub-pages"}

clean:                         # university page layout
  start_prefix: "Home/"        # main content starts after the breadcrumb
  stop_markers: ["To continue our founding mission", "Admin Office"]   # footer / side menu
chunk:
  max_words: 250
  overlap_words: 40
spacy_model: en_core_web_sm
