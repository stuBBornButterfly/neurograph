rules:                         # subject / condition / value + the exact sentence they come from
  - subject: probation
    condition: CGPA between 1 and 2.25 after the first two or any later semesters
    value: placed on probation for the next two semesters
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "whose CGPA will be between 1 and 2.25 after the first two or any subsequent semesters, will be placed on probation for the next two semesters"
  - subject: probation
    condition: CGPA still below 2.25 after the probation period
    value: dismissal from the university
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "Failure to raise their CGPA to at least 2.25 after the probation period"
  - subject: academic dismissal
    condition: CGPA below 1.0 after the first two or any later semesters
    value: automatic dismissal
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "whose CGPA falls below 1.0 after the first two or any subsequent semesters, will be automatically dismissed from the university"
  - subject: passing grade
    condition: 40% to less than 45%
    value: D (2.00), the lowest passing grade; below 40% is F
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "The letter grades A, B, C, and D are considered passing grades. The grade F is the failing grade."
  - subject: retake
    condition: improving a passed course
    value: a particular course may be retaken only once
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "students will be allowed to retake a particular course only once with any grade he/she earned previously"
  - subject: retake
    condition: course failed with F
    value: may be retaken any number of times within the graduation time limit; the last attempt counts
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "A student with 'F' Grade(s) in a course(s) may Retake the same any number of times to pass within the time limit allowed for Graduation."
  - subject: withdrawal
    condition: course dropped officially within the Academic Calendar date
    value: grade W
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "The grade \"Withdrawal\" (W) is assigned when a student officially drops a course within the date mentioned in the Academic Calendar for the semester."
  - subject: leave of absence
    condition: student in good academic standing
    value: up to three consecutive semesters, granted through the Dean of the faculty
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "Leave of absence or dropping a semester may be granted for up to three consecutive semesters/ one academic year to a student in good academic standing"
  - subject: re-scrutiny
    condition: error in marking or counting of a final exam script
    value: re-scrutiny only (no re-evaluation); grade change within 7 days of the next semester
    url: ${SITE_URL}/grades-rules-and-regulations
    quote: "Re-evaluation of Scripts of Final Examinations is not allowed."
