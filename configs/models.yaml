input_glob: /kaggle/input/**/derivatives/features/features.csv   # Phase 3 notebook output
cv:
  n_splits: 5
  n_repeats: 10                # 5-fold CV repeated with 10 different shuffles = 50 folds
  random_state: 97
logreg:
  Cs: 10                       # regularisation strengths tried in the inner CV
  inner_cv: 5
  max_iter: 5000
threshold: 0.5
feature_sets:                  # regex on features.csv columns; DE left out (same as log power)
  eeg_closed: '^closed_(delta|theta|alpha|beta|gamma)_(abs|rel)_|^closed_faa_|^iaf_hz$'
  eeg_all: '^(closed|open)_(delta|theta|alpha|beta|gamma)_(abs|rel)_|^(closed|open)_faa_|^iaf_hz$'
models:                        # name: feature set (null = none), add sex, subject subset
  majority:        {features: null, sex: false, subset: all, dummy: true}
  sex_only:        {features: null, sex: true, subset: all}
  eeg_closed:      {features: eeg_closed, sex: false, subset: all}
  eeg_all:         {features: eeg_all, sex: false, subset: all}
  sex_eeg_closed:  {features: eeg_closed, sex: true, subset: all}
  sex_eeg_noflag:  {features: eeg_closed, sex: true, subset: no_flagged}
  women_eeg:       {features: eeg_closed, sex: false, subset: female}
paired:                        # [with EEG, without EEG] on the same folds
  - [sex_eeg_closed, sex_only]
  - [eeg_closed, majority]
xgb:                           # fixed, conservative settings (no tuning with 120 people)
  n_estimators: 300
  max_depth: 2
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.5
  min_child_weight: 2
  random_state: 97
explain:                       # step 4.2
  models:
    eeg_closed_lr:   {features: eeg_closed, sex: false, subset: all, kind: logreg}
    eeg_all_lr:      {features: eeg_all, sex: false, subset: all, kind: logreg}
    eeg_closed_xgb:  {features: eeg_closed, sex: false, subset: all, kind: xgb}
    eeg_all_xgb:     {features: eeg_all, sex: false, subset: all, kind: xgb}
    women_closed_lr: {features: eeg_closed, sex: false, subset: female, kind: logreg}
    women_all_lr:    {features: eeg_all, sex: false, subset: female, kind: logreg}
  paired:
    - [eeg_all_lr, eeg_closed_lr]
    - [eeg_closed_xgb, eeg_closed_lr]
    - [eeg_all_xgb, eeg_all_lr]
  permutation:
    models: [eeg_closed_lr, eeg_all_lr, women_closed_lr]
    n_perm: 200
    n_splits: 5
    random_state: 97
  coef_model: eeg_all_lr       # logistic-regression weights, averaged over the 50 folds
  shap_model: eeg_all_xgb      # tree SHAP on the test folds
calibration:
  method: sigmoid              # Platt scaling; isotonic needs more people
  cv: 5
  bins: 10
tiers:                         # step 4.3
  models:
    eeg_closed_lr:      {features: eeg_closed, sex: false, subset: all, kind: logreg}
    eeg_all_lr:         {features: eeg_all, sex: false, subset: all, kind: logreg}
    eeg_closed_sexadj:  {features: eeg_closed, sex: true, subset: all, kind: logreg_sexadj}
    eeg_all_sexadj:     {features: eeg_all, sex: true, subset: all, kind: logreg_sexadj}
    sex_eeg_closed:     {features: eeg_closed, sex: true, subset: all, kind: logreg}
    sex_eeg_closed_cal: {features: eeg_closed, sex: true, subset: all, kind: logreg_cal}
    eeg_all_cal:        {features: eeg_all, sex: false, subset: all, kind: logreg_cal}
    eeg_closed_sexadj_cal: {features: eeg_closed, sex: true, subset: all, kind: logreg_sexadj_cal}   # 4.3b
  paired:
    - [eeg_closed_sexadj, eeg_closed_lr]
    - [eeg_all_sexadj, eeg_all_lr]
    - [sex_eeg_closed_cal, sex_eeg_closed]
  calibrate_compare: [sex_eeg_closed, sex_eeg_closed_cal, eeg_all_lr, eeg_all_cal, eeg_closed_sexadj_cal]
  tier_model: sex_eeg_closed_cal    # headline model, calibrated
  tier_model_nosex: eeg_closed_sexadj_cal   # 4.3b exploratory: tiers that cannot sort by sex
  permutation:                      # 4.3b: is the EEG signal left after removing sex above chance?
    models: [eeg_closed_sexadj, eeg_all_sexadj]
    n_perm: 200
    n_splits: 5
    random_state: 97
eegnet:                        # step 4.4, GPU notebook neurograph-41-eegnet
  epochs_glob: /kaggle/input/**/derivatives/epochs/*_epo.fif
  condition: closed            # same condition as the headline features
  exclude_channels: [FP1, FPZ, FP2]
  n_repeats: 3                 # first 3 of the 10 CV repeats -> the same 15 folds as the LR models
  val_frac: 0.15               # people held out of each training fold for early stopping
  f1: 8
  d: 2
  f2: 16
  kern_len: 125                # 0.5 s at 250 Hz: resolves 2 Hz and up
  dropout: 0.5
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  max_epochs: 60
  patience: 10
  seed: 97
  compare: eeg_closed_lr       # paired with this logistic regression (step 4.2 spec) on the same folds
