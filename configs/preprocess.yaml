montage: colin27_1005          # MNE template; the dataset's own positions have a frame bug
drop_channels: [CB1, CB2]      # cerebellar sites, not in the template
l_freq: 1.0                    # high-pass (ICA likes >= 1 Hz)
h_freq: 100.0
notch_freqs: [60]
bads:
  z_thresh: 3.5                # robust z for amplitude and high-frequency noise
  min_corr: 0.4                # best correlation with any other channel must exceed this
  lf_band: [1, 40]
  hf_band: [40, 100]
ica:
  method: picard               # extended + non-orthogonal = same model ICLabel was trained on
  n_components: 30
  decim: 3                     # fit on every 3rd sample; applied to all samples
  random_state: 97
  reject_labels: [eye blink, muscle artifact, heart beat, line noise, channel noise]
  min_prob: 0.7
analysis:                      # copy used for features; ICA weights from the 1-100 Hz copy
  l_freq: 0.5
  h_freq: 45.0                 # below 60 Hz, so no notch needed
epochs:
  length_s: 2.0
  decim: 2                     # 500 -> 250 Hz (safe after the 45 Hz low-pass)
autoreject:
  n_interpolate: [1, 4, 8]     # how many channels it may repair per epoch
  consensus: [0.2, 0.4, 0.6, 0.8]
  cv: 5
  random_state: 97
  n_jobs: -1